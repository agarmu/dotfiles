name: Update packages
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-experimental-features = nix-command flakes pipe-operators
      - name: Discover packages with update scripts
        id: discover
        run: |
          packages=$(
            nix eval --raw .#packages.x86_64-linux --apply '
              attrs: builtins.concatStringsSep " " (
                builtins.filter (n: builtins.isAttrs attrs.${n} && attrs.${n} ? passthru.updateScript)
                  (builtins.attrNames attrs)
              )
            '
          )
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
      - name: Run nix-update per package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for pkg in ${{ steps.discover.outputs.packages }}; do
            echo "::group::Updating $pkg"
            branch="chore/update-$pkg"

            if git ls-remote --exit-code origin "refs/heads/$branch" 2>/dev/null; then
              echo "Branch $branch exists on origin, fetching and rebasing"
              git fetch origin "$branch"
              git checkout "$branch"
              git rebase main || git rebase --abort
            else
              echo "Creating new branch $branch"
              git checkout main
              git checkout -b "$branch"
            fi

            if ! nix run nixpkgs#nix-update -- --flake --use-update-script "$pkg"; then
              echo "nix-update failed for $pkg, skipping"
              echo "::endgroup::"
              continue
            fi

            if git diff --quiet; then
              echo "No updates for $pkg"
              echo "::endgroup::"
              continue
            fi

            git add -A
            git commit -m "chore($pkg): update" 2>/dev/null || true
            git push origin "$branch" --force

            pr_url=$(gh pr list --head "$branch" --json url --jq '.[0].url' 2>/dev/null)
            if [ -n "$pr_url" ]; then
              echo "PR already exists: $pr_url"
            else
              gh pr create --title "chore($pkg): update" \
                --body "Automated update via nix-update." \
                --base main --head "$branch" || true
            fi
            echo "::endgroup::"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIX_PATH: nixpkgs=channel:nixpkgs-unstable
