name: Update packages
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-experimental-features = nix-command flakes pipe-operators
      - name: Discover packages with update scripts
        id: discover
        run: |
          packages=$(
            nix eval --raw .#packages.x86_64-linux --apply '
              attrs: builtins.concatStringsSep " " (
                builtins.filter (n: builtins.isAttrs attrs.${n} && attrs.${n} ? passthru.updateScript)
                  (builtins.attrNames attrs)
              )
            '
          )
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
      - name: Run nix-update per package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for pkg in ${{ steps.discover.outputs.packages }}; do
            echo "::group::Updating $pkg"
            git checkout main
            git branch -D "chore/update-$pkg" 2>/dev/null || true
            git checkout -b "chore/update-$pkg"

            if ! nix run nixpkgs#nix-update -- --flake --use-update-script "$pkg"; then
              echo "nix-update failed for $pkg, skipping"
              git checkout main
              git branch -D "chore/update-$pkg" 2>/dev/null || true
              continue
            fi

            if git diff --quiet; then
              echo "No updates for $pkg"
              git checkout main
              git branch -D "chore/update-$pkg" 2>/dev/null || true
              continue
            fi

            git add -A
            git commit -m "chore($pkg): update"
            git push origin "chore/update-$pkg" --force
            gh pr create --title "chore($pkg): update" \
              --body "Automated update via nix-update." \
              --base main --head "chore/update-$pkg" || true
            echo "::endgroup::"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIX_PATH: nixpkgs=channel:nixpkgs-unstable
