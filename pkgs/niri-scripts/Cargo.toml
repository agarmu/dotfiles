[package]
name = "niri-scripts"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
scopeguard = "1.2.0"

[[bin]]
name = "support-sticky-floating"
path = "src/support-sticky-floating.rs"

[[bin]]
name = "wallpaper-per-workspace"
path = "src/wallpaper-per-workspace.rs"

[[bin]]
name = "screenshot"
path = "src/screenshot.rs"
